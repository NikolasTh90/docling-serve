{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docling-serve.fullname" . }}-ollama
  namespace: {{ include "docling-serve.namespace" . }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  {{- if not .Values.ollama.autoscaling.enabled }}
  replicas: {{ .Values.ollama.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "docling-serve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      {{- with .Values.ollama.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "docling-serve.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
        version: v1
    spec:
      imagePullSecrets:
        {{- if .Values.pullSecret.create }}
        - name: {{ .Values.pullSecret.name | default (printf "%s-pull-secret" (include "docling-serve.fullname" .)) }}
        {{- end }}
        {{- with .Values.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.ollama.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          {{- if .Values.ollama.nodeAffinity.required }}
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.ollama.nodeAffinity.preferredNode }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.ollama.nodeAffinity.preferredNode }}
          {{- end }}
      {{- end }}
      serviceAccountName: {{ include "docling-serve.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.ollama.podSecurityContext | nindent 8 }}
      containers:
        - name: ollama
          securityContext:
            {{- toYaml .Values.ollama.securityContext | nindent 12 }}
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "docling-serve.fullname" . }}-ollama-config
            {{- if .Values.proxy.enabled }}
            - configMapRef:
                name: {{ include "docling-serve.fullname" . }}-proxy
            {{- end }}
          volumeMounts:
            - name: models-storage
              mountPath: /models
          resources:
            {{- if .Values.ollama.resources.requests }}
            requests:
              {{- toYaml .Values.ollama.resources.requests | nindent 14 }}
              {{- if .Values.ollama.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.ollama.gpu.count }}
              {{- end }}
            {{- end }}
            {{- if .Values.ollama.resources.limits }}
            limits:
              {{- toYaml .Values.ollama.resources.limits | nindent 14 }}
              {{- if .Values.ollama.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.ollama.gpu.count }}
              {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: models-storage
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "docling-serve.fullname" . }}-ollama-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}