{{- if .Values.translation.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docling-serve.fullname" . }}-translation
  namespace: {{ include "docling-serve.namespace" . }}
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: translation
spec:
  {{- if not .Values.translation.autoscaling.enabled }}
  replicas: {{ .Values.translation.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "docling-serve.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: translation
  template:
    metadata:
      {{- with .Values.translation.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "docling-serve.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: translation
        version: v1
    spec:
      imagePullSecrets:
        {{- if .Values.pullSecret.create }}
        - name: {{ .Values.pullSecret.name | default (printf "%s-pull-secret" (include "docling-serve.fullname" .)) }}
        {{- end }}
        {{- with .Values.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.translation.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          {{- if .Values.translation.nodeAffinity.required }}
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.translation.nodeAffinity.preferredNode }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.translation.nodeAffinity.preferredNode }}
          {{- end }}
      {{- end }}
      serviceAccountName: {{ include "docling-serve.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.translation.podSecurityContext | nindent 8 }}
      containers:
        - name: translation
          securityContext:
            {{- toYaml .Values.translation.securityContext | nindent 12 }}
          image: "{{ .Values.translation.image.repository }}:{{ .Values.translation.image.tag }}"
          imagePullPolicy: {{ .Values.translation.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: LT_LOAD_ONLY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "docling-serve.fullname" . }}-translation-config
                  key: LT_LOAD_ONLY
            {{- if .Values.proxy.enabled }}
            - name: HTTP_PROXY
              value: {{ .Values.proxy.httpProxy | quote }}
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.httpsProxy | quote }}
            - name: NO_PROXY
              value: {{ .Values.proxy.noProxy | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "docling-serve.fullname" . }}-translation-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- if or .Values.translation.resources.requests .Values.translation.gpu.enabled }}
            requests:
              {{- if .Values.translation.resources.requests }}
              {{- toYaml .Values.translation.resources.requests | nindent 14 }}
              {{- end }}
              {{- if .Values.translation.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.translation.gpu.count }}
          {{- end }}
            {{- end }}
            {{- if or .Values.translation.resources.limits .Values.translation.gpu.enabled }}
            limits:
              {{- if .Values.translation.resources.limits }}
              {{- toYaml .Values.translation.resources.limits | nindent 14 }}
              {{- end }}
              {{- if .Values.translation.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.translation.gpu.count }}
              {{- end }}
            {{- end }}
          volumeMounts:
            {{- if .Values.translation.persistence.enabled }}
            - name: translation-data
              mountPath: /app/argostranslate/models
            {{- else }}
            - name: models
              mountPath: /app/argostranslate/models
            {{- end }}
      volumes:
        {{- if .Values.translation.persistence.enabled }}
        - name: translation-data
          persistentVolumeClaim:
            claimName: {{ include "docling-serve.fullname" . }}-translation-pvc
        {{- else }}
        - name: models
          emptyDir: {}
        {{- end }}
      {{- with .Values.translation.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.translation.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}