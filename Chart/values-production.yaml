# Production overrides
replicaCount: 1

# Enable GPU for production - use all available GPUs
gpu:
  enabled: true
  count: 1  # This tells Kubernetes to allocate all available GPUs

image:
  tag: "main"
  pullPolicy: Always

resources:
  requests:
    cpu: 500m  # More aggressive CPU for production
    memory: 1Gi
  limits:
    cpu: 28
    memory: 150Gi

nodeAffinity:
  enabled: true
  preferredNode: office-worker-8
  required: true  # Require specific node in production

persistence:
  size: 10Gi  # Larger storage for production

env:
  uvicorn:
    logLevel: "debug"  # Less verbose logging
    workers: 1  # More workers for production
  translation:
    enabled: true

# Skip namespace creation since we created it manually
namespaceOverride: docling-serve

# Proxy settings for production
proxy:
  enabled: true
  # Values will inherit from main values.yaml unless overridden here

# istio:
#   gateway:
#     tls:
#       enabled: true
#       credentialName: ocr-tls-secret
pullSecret:
  create: true
  name: docling-serve-pull-secret
  dockerconfigjson: |
    {
      "auths": {
        "quay.io": {
          "auth": "cHh3b3JrcytweHdfaHR6X2s4c19jbHVzdGVyOkxZTkpaOVNYUExXQlNXU0E3NTJXTDBZOTMxNTdPUUI4QThKN1lDUE43OEVIN0pUOTVPWDVCVlo5WVBYQUxUMTQ=",
          "email": ""
        }
      }
    }

command:
  enabled: false
  value: ["uv", "run", "--extra", "ui", "docling-serve", "run", "--host", "0.0.0.0", "--port", "5001", "--enable-ui"]

# Enable translation service in production
translation:
  enabled: true
  replicaCount: 0
  
  # Use GPU-enabled translation service
  gpu:
    enabled: true
    count: 1
  
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  
  # Use same node as main service
  nodeAffinity:
    enabled: true
    preferredNode: office-worker-8
    required: true
  
  persistence:
    size: 30Gi  # Larger storage for translation models


# Enable Ollama service in production
ollama:
  enabled: true
  replicaCount: 0
  
  # Use GPU-enabled Ollama
  gpu:
    enabled: true
    count: 1
  
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  
  # Use same node as main service for GPU sharing
  nodeAffinity:
    enabled: true
    preferredNode: office-worker-8
    required: true
  
  persistence:
    size: 50Gi  # Large storage for Ollama models