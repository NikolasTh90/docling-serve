# Global settings
global:
  nameOverride: ""
  fullnameOverride: ""

# GPU configuration
gpu:
  enabled: false
  count: 1 # Use all available GPUs on the node

# Image configuration
image:
  repository: quay.io/pxworks/docling-serve
  tag: gpu
  pullPolicy: IfNotPresent

# Image pull secrets for private repositories
imagePullSecrets:
  - name: quay-registry-secret

# Pull Secret configuration
pullSecret:
  create: false
  name: ""
  annotations: {}
  # Base64 encoded .dockerconfigjson content
  # Example: {"auths":{"quay.io":{"auth":"<base64-encoded-username:password>","email":""}}}
  dockerconfigjson: ""

# Container command configuration
command:
  enabled: true
  value: ["uv", "run", "--extra", "ui", "docling-serve", "run", "--host", "0.0.0.0", "--port", "5001", "--enable-ui"]

# Service configuration
service:
  type: ClusterIP
  port: 5001
  targetPort: 5001

# Ingress configuration
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: ocr.k8s2.pxworks.co
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Istio configuration
istio:
  enabled: true
  gateway:
    enabled: true
    name: docling-serve-gateway
    hosts:
      - ocr.k8s2.pxworks.co
    tls:
      enabled: false
      credentialName: docling-serve-tls
  virtualService:
    enabled: true
    timeout: 600s

# Resource configuration
resources:
  requests:
    cpu: 24000m
    memory: 4Gi
  limits:
    cpu: 31500m
    memory: 12Gi

# Node affinity configuration
nodeAffinity:
  enabled: true
  preferredNode: office-worker-8
  required: false  # Set to true to require specific node

# Autoscaling (disabled by default for single node preference)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Replica count
replicaCount: 1

# Storage configuration
persistence:
  enabled: true
  storageClass: longhorn
  accessMode: ReadWriteMany
  size: 10Gi
  annotations: {}

# Pod configuration
podAnnotations:
  sidecar.istio.io/proxyCPU: "100m"
  sidecar.istio.io/proxyMemory: "128Mi"

podSecurityContext: {}

securityContext: {}

# Proxy configuration
proxy:
  enabled: true
  httpProxy: "http://pxw:*YXoDq728gcz_z_rAnLhh3e._7KELCH4@10.0.90.54:3128"
  httpsProxy: "http://pxw:*YXoDq728gcz_z_rAnLhh3e._7KELCH4@10.0.90.54:3128"
  noProxy: "localhost,169.254.169.254/32,127.0.0.1,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12,.svc,.cluster.local,office-worker-1,office-worker-2,office-worker-3,office-worker-4,office-worker-5,office-worker-6,office-worker-7,office-worker-8,office-worker-9,office-worker-10,metrics-monitoring,kube-state-metrics"

# Environment variables
env:
  # UV Settings
  uv:
    concurrentDownloads: 50
  # Arabic Correction Settings
  arabic:
    enabled: false
    ollamaHost: "http://localhost:11434"
    modelName: "command-r7b-arabic:latest"
    timeout: 1800
    enableRemoteServices: false

  # OCRMyPDF Preprocessing Settings
  ocrmypdf:
    enabled: true
    deskew: true
    clean: true
    optimize: 2
    oversample: 200
    removeBackground: false
    forceOcr: true
    skipText: false
    redoOcr: false
    progressBar: false
    timeout: 1800
    languageDetection: true
    maxFileSizeMb: 200
    failOnError: false
    fallbackOnFailure: true
    parallelProcessing: true
    cleanFinal: true
    verbosity: 0
    progressBarFriendly: true
    manageRootLogger: false

  # Translation Settings
  translation:
    enabled: false
    libretranslateHost: "http://docling-serve-translation.docling-serve.svc.cluster.local:5000"
    apiKey: ""  # Optional - leave empty if not needed
    timeout: 60
    minConfidence: 0.9
    maxTextLength: "1000000"  # sys.maxsize equivalent

  # Uvicorn Settings
  uvicorn:
    reload: false
    host: "0.0.0.0"
    port: 5001
    logLevel: "info"
    workers: 16

  # Docling Serve Settings
  doclingServe:
    enableUi: true
    artifactsPath: ""
    apiHost: "0.0.0.0"
    maxDocumentTimeout: 86400
    maxSyncWait: 1800

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Namespace configuration
namespaceOverride: ""

# Translation Service Configuration
translation:
  enabled: false
  replicaCount: 1
  
  image:
    repository: libretranslate/libretranslate
    tag: latest-cuda
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 5000
  
  # GPU configuration for translation service
  gpu:
    enabled: true
    count: 1
  
  # Resource configuration
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  
  # Node affinity configuration
  nodeAffinity:
    enabled: true
    preferredNode: office-worker-8
    required: false
  
  # Storage configuration for models
  persistence:
    enabled: true
    storageClass: longhorn
    accessMode: ReadWriteMany
    size: 20Gi  # Models can be large
    annotations: {}
  
  # Pod configuration
  podAnnotations:
    sidecar.istio.io/proxyCPU: "100m"
    sidecar.istio.io/proxyMemory: "128Mi"
  
  podSecurityContext: {}
  securityContext: {}
  
  # Environment variables for LibreTranslate
  env:
    apiKeys: ""  # Optional: comma-separated API keys
    requireApiKeyOrigin: ""  # Optional: require API key for specific origins
    loadOnly: ""  # Optional: comma-separated language codes to load only specific models
    threads: "4"  # Number of threads to use
    updateModels: "true"  # Whether to update models on startup
  
  # Autoscaling
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  
  nodeSelector: {}
  tolerations: []
